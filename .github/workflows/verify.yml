name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compile-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q core services ui wallets launch tools
      - run: python tools/public_release_verify.py
